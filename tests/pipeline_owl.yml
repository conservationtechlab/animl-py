# directories and model files
image_dir:  "examples/BUOW"
working_dir: "examples/BUOW"

# data ingestion
exif: True
data_timezone: Null
station_depth: Null
camera_depth: Null
# video processing
parallel: True
frames: 1
fps: Null

# inference
device: cuda:0
batch_size: 4
num_workers: 4
# detection
detector_file: "models/buow_2026.pt"
detector_class_list: "models/buow_2026_classes.txt"
detector_type: "yolo"
detection_resize_height: 640
detection_resize_width: 640
detection_file_col: filepath
letterbox: True
checkpoint_frequency: 10
detect_only: True

# export
# sort
sort: True
copy: True
# visualization
visualize: True
