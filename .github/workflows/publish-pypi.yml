name: Publish to PyPI

on:
  push:
    tags:
      # Triggers on any tag matching v1.0.0, v1.2.3, v1.2.3rc1, etc.
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch: {}

# Restrict default GITHUB_TOKEN permissions; this workflow doesn't need write access.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify tag matches package version
        # Only meaningful for real tag pushes; skipped on manual test runs
        # since there's no tag to check against.
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import glob, re; \
            f = glob.glob('dist/*.whl')[0]; \
            print(re.search(r'-([0-9][^-]*)-py', f).group(1))")
          echo "Tag version:     $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match built package version ($PKG_VERSION)."
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/animl/
    permissions:
      id-token: write  # required for OIDC trusted publishing; no API token needed
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1