# directories and model files
image_dir:  "examples/Southwest"
working_dir: "examples/Southwest"

# data ingestion
exif: True
data_timezone: Null
station_depth: Null
camera_depth: Null
# video processing
parallel: True
frames: 1
fps: Null

# inference
device: cuda:0
batch_size: 4
num_workers: 4
# detection
detector_file: "models/md_v5a.0.0.pt"
detector_type: "mdv5"
detection_resize_height: 1280
detection_resize_width: 1280
detection_file_col: filepath
letterbox: True
checkpoint_frequency: 1000
# classification
classifier_file: models/sdzwa_southwest_v3.pt
class_list: models/sdzwa_southwest_v3_classes.csv
classification_resize_height: 299
classification_resize_width: 299
classification_file_col: filepath
class_label_col: class
empty_class: Empty # necessary for sequence classification
best_only: True
# export
# sort
sort: True
copy: True
# visualization
visualize: True
